name: Update projects

on:
  schedule:
    - cron: "17 5 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pinned and recent repositories
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          # generatedAt always changes; only commit when the repo list itself does
          if git diff --quiet -I '"generatedAt"' -- data/projects.json && git ls-files --error-unmatch data/projects.json >/dev/null 2>&1; then
            echo "No project changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore: update projects data"
          git push
